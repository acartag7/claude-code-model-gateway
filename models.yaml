version: 1
fallbackModel: claude-opus-5
autoCompactEnabled: true
autoCompactPercent: 95

models:
  # ── Anthropic ── native Claude budgets; keep the [1m] ids, no env override
  - id: claude-fable-5-1
    name: Claude Fable 5.1
    provider: anthropic
    contextTokens: 1000000
    contextEvidence: provider-docs
    claudeCodeModel: claude-fable-5-1[1m]
    recommendedEffort: high
    roles: [hardest-synthesis, long-running-reasoning, multistep-research]

  - id: claude-opus-5
    name: Claude Opus 5
    provider: anthropic
    contextTokens: 1000000
    contextEvidence: provider-docs
    claudeCodeModel: claude-opus-5[1m]
    recommendedEffort: xhigh
    roles: [agentic-coding, long-horizon-implementation, code-review, contract-review]

  # ── OpenAI Codex ── bare ids; CLAUDE_CODE_MAX_CONTEXT_TOKENS carries the window
  - id: gpt-5.6-sol
    name: GPT 5.6 Sol
    provider: openai-codex
    contextTokens: 272000
    contextEvidence: provider-docs
    claudeCodeModel: gpt-5.6-sol
    recommendedEffort: xhigh
    roles: [acceptance-design, complex-implementation, research]

  - id: gpt-6-astra
    name: GPT 6.0 Astra
    provider: openai-codex
    contextTokens: 272000
    contextEvidence: provider-docs
    claudeCodeModel: gpt-6-astra
    recommendedEffort: xhigh
    roles: [hardest-synthesis, complex-implementation, integration-review]

  - id: gpt-daybreak-blue-latest
    name: Daybreak Blue
    provider: openai-codex
    contextTokens: 272000
    contextEvidence: provider-docs
    claudeCodeModel: gpt-daybreak-blue-latest
    recommendedEffort: high
    roles: [defensive-security, security-review, adversarial-review]

  # ── xAI ──
  - id: grok-4.5
    name: Grok 4.5
    provider: xai
    contextTokens: 500000
    contextEvidence: provider-docs
    claudeCodeModel: grok-4.5
    recommendedEffort: high
    roles: [independent-review, cross-family-reasoning]

  - id: grok-composer-2.5-fast
    name: Grok Composer 2.5 Fast
    provider: xai
    contextTokens: 200000
    contextEvidence: provider-docs
    claudeCodeModel: grok-composer-2.5-fast
    recommendedEffort: high
    roles: [fast-exploration, narrow-mechanical-work]

  # ── Z.AI ──
  - id: zai/glm-5.3
    name: GLM 5.3
    provider: zai
    contextTokens: 1000000
    contextEvidence: provider-docs
    claudeCodeModel: zai/glm-5.3
    recommendedEffort: max
    roles: [implementation, large-repository-work, general-engineering]

  - id: zai/glm-5.3-flash
    name: GLM 5.3 Flash
    provider: zai
    contextTokens: 1000000
    contextEvidence: provider-docs
    claudeCodeModel: zai/glm-5.3-flash
    recommendedEffort: max
    roles: [fast-implementation, general-engineering]

  # ── Cursor ── windows from the gateway embedded registry where it has them
  - id: composer-2.5
    name: Composer 2.5
    provider: cursor
    contextTokens: 200000
    contextEvidence: provider-catalog-fallback
    claudeCodeModel: composer-2.5
    recommendedEffort: high
    roles: [cursor-agent, general-engineering]

  - id: composer-2.5-fast
    name: Composer 2.5 Fast
    provider: cursor
    contextTokens: 200000
    contextEvidence: provider-catalog-fallback
    claudeCodeModel: composer-2.5-fast
    recommendedEffort: high
    roles: [fast-implementation, narrow-mechanical-work]

  - id: cursor-grok-4.6-xhigh
    name: Cursor Grok 4.6 XHigh
    provider: cursor
    contextTokens: 500000
    contextEvidence: embedded-registry
    claudeCodeModel: cursor-grok-4.6-xhigh
    recommendedEffort: high
    roles: [independent-review, adversarial-review]

  - id: kimi-k3-max
    name: Kimi K3 Max
    provider: cursor
    contextTokens: 1048576
    contextEvidence: embedded-registry
    claudeCodeModel: kimi-k3-max
    recommendedEffort: high
    roles: [coding-implementation, repository-work]

  - id: gemini-3.8-flash-high
    name: Gemini 3.8 Flash High
    provider: cursor
    contextTokens: 1048576
    contextEvidence: embedded-registry
    claudeCodeModel: gemini-3.8-flash-high
    recommendedEffort: high
    roles: [multistep-research, long-context-evaluation]

  - id: muse-spark-1.3-max
    name: Muse Spark 1.3 Max
    provider: cursor
    contextTokens: 200000
    contextEvidence: unverified-default
    claudeCodeModel: muse-spark-1.3-max
    recommendedEffort: high
    roles: [experimental-coding]

  - id: kimi-k2.7-code
    name: Kimi K2.7 Code
    provider: cursor
    contextTokens: 262144
    contextEvidence: provider-docs
    claudeCodeModel: kimi-k2.7-code
    recommendedEffort: high
    roles: [coding-implementation, repository-work]

agents:
  - name: spec-critic
    description: Find contract ambiguity, unsafe gaps, and acceptance-test omissions before implementation starts.
    model: claude-opus-5
    effort: xhigh
    tools: [Read, Grep, Glob]

  - name: acceptance-author
    description: Turn a ready contract into hostile black-box acceptance tests without editing implementation code.
    model: gpt-5.6-sol
    effort: xhigh

  - name: implementer
    description: Implement an approved contract against frozen acceptance tests.
    model: zai/glm-5.3
    effort: max

  - name: integration-reviewer
    description: Review wiring, runtime behavior, and cross-boundary integration against the exact commit.
    model: gpt-6-astra
    effort: high
    tools: [Read, Grep, Glob, Bash]

  - name: independent-reviewer
    description: Provide an independent cross-family review of a completed implementation.
    model: grok-4.5
    effort: high
    tools: [Read, Grep, Glob, Bash]

  - name: fast-worker
    description: Handle narrow, mechanical coding tasks where latency matters more than broad synthesis.
    model: grok-composer-2.5-fast
    effort: high

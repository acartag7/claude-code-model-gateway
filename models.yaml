agents:
  - name: spec-critic
    description: Find contract ambiguity, unsafe gaps, and acceptance-test omissions before implementation starts.
    model: claude-opus-4-8
    effort: xhigh
    tools: [Read, Grep, Glob]

  - name: acceptance-author
    description: Turn a ready contract into hostile black-box acceptance tests without editing implementation code.
    model: gpt-5.6-sol
    effort: xhigh

  - name: implementer
    description: Implement an approved contract against frozen acceptance tests.
    model: zai/glm-5.2
    effort: max
    contextMode: full

  - name: integration-reviewer
    description: Review wiring, runtime behavior, and cross-boundary integration against the exact commit.
    model: gpt-5.6-terra
    effort: high
    tools: [Read, Grep, Glob, Bash]

  - name: independent-reviewer
    description: Provide an independent cross-family review of a completed implementation.
    model: grok-4.5
    effort: high
    tools: [Read, Grep, Glob, Bash]

  - name: fast-worker
    description: Handle narrow, mechanical coding tasks where latency matters more than broad synthesis.
    model: gpt-5.3-codex-spark
    effort: high
